<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design Studio | Shorepine Landscape Studio</title>
<base href="../">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4B4F'/%3E%3Cpath d='M32 10 L44 30 H37 L47 46 H17 L27 30 H20 Z' fill='%23E4EAE7'/%3E%3Crect x='29.5' y='46' width='5' height='8' fill='%23B9A68A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
  #quote-back {
    color: var(--dim); text-decoration: none; font-size: 12px; white-space: nowrap;
    border: 1px solid var(--line); background: var(--panel2);
    padding: 5px 10px; border-radius: 7px;
  }
  #quote-back:hover { border-color: var(--accent2); color: var(--text); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body data-mode="design">
<header id="topbar">
  <button id="menu-btn" title="Tools & elements">☰</button>
  <a id="quote-back" href="demo/index.html">← Back to site</a>
  <div id="brand">🌲 <span class="brandname">Shorepine Design Studio</span></div>
  <div id="actions">
    <button id="btn-new" title="Clear the current mode">New</button>
    <button id="btn-undo" title="Undo (Ctrl+Z)">↩ Undo</button>
    <span class="sep"></span>
    <button id="btn-save" title="Save to this browser">Save</button>
    <button id="btn-load" title="Load browser save">Load</button>
    <button id="btn-export" title="Download design as a file">Export</button>
    <button id="btn-import" title="Open a design file">Import</button>
    <button id="btn-shot" title="Download a rendered image">📷</button>
    <button id="btn-est" class="hidden" title="Show/hide cost estimate">💲</button>
    <span class="sep"></span>
    <button id="btn-top" class="design-only" title="Top-down view">Top</button>
    <button id="btn-grid" class="design-only" title="Toggle grid (G)">Grid</button>
  </div>
</header>
<div id="main">
  <aside id="sidebar">
    <section>
      <h3>Tools</h3>
      <div class="grid tools">
        <button class="tool active" data-tool="select">🖱️ Select</button>
        <button class="tool design-only" data-tool="sculpt-up">⛰️ Raise</button>
        <button class="tool design-only" data-tool="sculpt-down">🕳️ Lower</button>
      </div>
      <div class="design-only">
        <h3>Ground paint</h3>
        <div class="grid" id="paints"></div>
      </div>
      <label class="slider">Brush size<input id="brush" type="range" min="0.5" max="6" step="0.1" value="2"></label>
    </section>
    <section id="palette">
      <h3>Add elements</h3>
      <div id="palette-groups"></div>
    </section>
  </aside>
  <div id="viewport">
    <canvas id="c"></canvas>
    <div id="sel-panel" class="floating hidden">
      <h3 id="sel-name">Selected</h3>
      <label class="slider">Rotate<input id="sel-rot" type="range" min="0" max="360" step="1" value="0"></label>
      <label class="slider">Scale<input id="sel-scale" type="range" min="0.3" max="3" step="0.05" value="1"></label>
      <div id="row-tiers" class="hidden">
        <label class="slider">2nd row from<input id="tier-row2" type="range" min="0" max="10" step="0.5" value="10"><span id="tier-row2-v" class="tierv">none</span></label>
        <label class="slider">3rd row from<input id="tier-row3" type="range" min="0" max="10" step="0.5" value="10"><span id="tier-row3-v" class="tierv">none</span></label>
      </div>
      <div id="terrace-opts" class="hidden">
        <label class="slider">Height<input id="terrace-h" type="range" min="1" max="5" step="0.5" value="2"><span id="terrace-h-v" class="tierv">2 ft</span></label>
        <label class="selectrow">Wall<select id="terrace-wall"></select></label>
      </div>
      <div id="shore-opts" class="hidden">
        <button id="shore-flip" title="Put the water on the other side of the shoreline">⇄ Flip water side</button>
      </div>
      <label class="colorrow hidden" id="row-body">Body color<input type="color" id="col-body" value="#d9d2c3"></label>
      <label class="colorrow hidden" id="row-roof">Roof / accent<input type="color" id="col-roof" value="#6b6560"></label>
      <button id="col-reset" class="hidden">Reset colors</button>
      <div class="row">
        <button id="sel-dup">Duplicate</button>
        <button id="sel-del" class="danger">Delete</button>
      </div>
    </div>
    <div id="est-panel" class="floating hidden">
      <h3 id="est-head" title="Collapse / expand"><span class="chev">▾</span> 💲 Estimate <span id="est-total">$0</span></h3>
      <div id="est-rows"></div>
      <button id="est-add">＋ Add line item (pruning, digging, debris removal…)</button>
      <div class="row">
        <button id="est-print">🖨 Print / PDF</button>
        <button id="est-email">✉️ Email</button>
      </div>
      <div id="est-note"></div>
    </div>
    <div id="draw-actions" class="hidden">
      <button id="draw-done">✓ Done</button>
      <button id="draw-cancel">✕ Cancel</button>
    </div>
    <div id="hint"></div>
  </div>
</div>
<footer class="site-credit"><a href="https://digitaldoorwaymarketing.com" target="_blank" rel="noopener"><img src="assets/digital-doorway.png" width="128" height="96" alt="" loading="lazy">Website by <strong>Digital Doorway Marketing</strong></a></footer>
<input type="file" id="file-import" accept="application/json" hidden>
<script>
window.__VERDURA_QUOTE = {
  business: "Shorepine Landscape Studio",
  brand: "Shorepine Design Studio",
  title: "Design Studio | Shorepine Landscape Studio",
  mark: "🌲",
  send: false,
  camera: { p: [-14, 15, -31], t: [0, 0, -1] }
};
</script>
<script>if (window.self !== window.top) document.getElementById('quote-back').remove(); // embedded on the site: no way "back" inside the frame</script>
<script type="module" src="js/app.js?v=2"></script>
</body>
</html>
